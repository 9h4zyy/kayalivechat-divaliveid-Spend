          - button [ref=f8e140] [cursor=pointer]:
            - heading "Can a Kaya Chat agent also become a host?" [level=4] [ref=f8e141]
            - generic [aria-hidden] [ref=f8e142]: ▾
          - paragraph [ref=f8e143]: Yes. Agent accounts can also be used to host live sessions. An agent can therefore explore hosting while continuing to support a host team.
