        - generic [ref=f8e134]:
          - button [ref=f8e135] [cursor=pointer]:
            - heading "What is the difference between a Kaya Chat host and an agent?" [level=4] [ref=f8e136]
            - generic [aria-hidden] [ref=f8e137]: ▾
          - paragraph [ref=f8e138]: A host focuses on voice-room activities, interacting with participants, and completing host tasks. An agent focuses on building and supporting a team of hosts, inviting hosts and sub-agents, and managing team activity. Each role has its own earning options and requirements.
