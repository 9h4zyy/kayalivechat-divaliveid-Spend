        - generic [ref=f19e187]:
          - heading "1. Commission Rate Calculation" [level=4] [ref=f19e188]
          - list [ref=f19e189]:
            - listitem [ref=f19e190]: • A's effective total income = A + B + C + D + E + F + G + H + I + J + K = 395M (22% commission rate).
            - listitem [ref=f19e191]: • B's effective total income = B + D + F + H + J = 148M (18% commission rate, as stated in the source).
            - listitem [ref=f19e192]: • C's effective total income = C + E + G + I + K = 167M (20% commission rate).
        - generic [ref=f19e193]:
          - heading "2. Sub-agent commission formula:" [level=4] [ref=f19e194]
          - paragraph [ref=f19e195]: • Sub-agent commission = (Master agent commission rate − Sub-agent commission rate) × total income of (T2 + T3 + T4 + T5 + T6).
        - generic [ref=f19e196]:
          - heading "3. Agent Commission from Sub-agents" [level=4] [ref=f19e197]
          - list [ref=f19e198]:
            - listitem [ref=f19e199]: • Commission A receives from B = (22% − 18%) × 148M = 5.92M.
            - listitem [ref=f19e200]: • Commission A receives from C = (22% − 20%) × 167M = 3.34M.
            - listitem [ref=f19e201]: • A's total commission from sub-agents = 5.92M + 3.34M = 9.26M, shown in the source as 926 USD.
