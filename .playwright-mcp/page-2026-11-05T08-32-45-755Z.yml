      - generic [ref=f2e188]:
        - generic [ref=f2e189]:
          - heading "1. Commission Rate Calculation" [level=4] [ref=f2e190]
          - list [ref=f2e191]:
            - listitem [ref=f2e192]: • A's effective total income = A + B + C + D + E + F + G + H + I + J + K = 395M (22% commission rate).
            - listitem [ref=f2e193]: • B's effective total income = B + D + F + H + J = 148M (18% commission rate, as stated in the source).
            - listitem [ref=f2e194]: • C's effective total income = C + E + G + I + K = 167M (20% commission rate).
        - generic [ref=f2e195]:
          - heading "2. Sub-agent commission formula:" [level=4] [ref=f2e196]
          - paragraph [ref=f2e197]: • Sub-agent commission = (Master agent commission rate − Sub-agent commission rate) × total income of (T2 + T3 + T4 + T5 + T6).
        - generic [ref=f2e198]:
          - heading "3. Agent Commission from Sub-agents" [level=4] [ref=f2e199]
          - list [ref=f2e200]:
            - listitem [ref=f2e201]: • Commission A receives from B = (22% − 18%) × 148M = 5.92M.
            - listitem [ref=f2e202]: • Commission A receives from C = (22% − 20%) × 167M = 3.34M.
            - listitem [ref=f2e203]: • A's total commission from sub-agents = 5.92M + 3.34M = 9.26M, shown in the source as 926 USD.
