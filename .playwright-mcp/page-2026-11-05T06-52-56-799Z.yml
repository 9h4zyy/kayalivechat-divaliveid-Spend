        - generic [ref=e530]:
          - generic [ref=e531]:
            - heading "1. Commission Rate Calculation" [level=4] [ref=e532]
            - list [ref=e533]:
              - listitem [ref=e534]: • A's effective total income = A + B + C + D + E + F + G + H + I + J + K = 395M (22% commission rate).
              - listitem [ref=e535]: • B's effective total income = B + D + F + H + J = 148M (18% commission rate, as stated in the source).
              - listitem [ref=e536]: • C's effective total income = C + E + G + I + K = 167M (20% commission rate).
          - generic [ref=e537]:
            - heading "2. Sub-agent commission formula:" [level=4] [ref=e538]
            - paragraph [ref=e539]: • Sub-agent commission = (Master agent commission rate − Sub-agent commission rate) × total income of (T2 + T3 + T4 + T5 + T6).
          - generic [ref=e540]:
            - heading "3. Agent Commission from Sub-agents" [level=4] [ref=e541]
            - list [ref=e542]:
              - listitem [ref=e543]: • Commission A receives from B = (22% − 18%) × 148M = 5.92M.
              - listitem [ref=e544]: • Commission A receives from C = (22% − 20%) × 167M = 3.34M.
              - listitem [ref=e545]: • A's total commission from sub-agents = 5.92M + 3.34M = 9.26M, shown in the source as 926 USD.
