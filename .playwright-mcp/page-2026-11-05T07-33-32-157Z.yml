            - list [ref=f1e528]:
              - listitem [ref=f1e529]: • A's effective total income = A + B + C + D + E + F + G + H + I + J + K = 395M (22% commission rate).
              - listitem [ref=f1e530]: • B's effective total income = B + D + F + H + J = 148M (18% commission rate, as stated in the source).
              - listitem [ref=f1e531]: • C's effective total income = C + E + G + I + K = 167M (20% commission rate).
          - generic [ref=f1e532]:
            - heading "2. Sub-agent commission formula:" [level=4] [ref=f1e533]
            - paragraph [ref=f1e534]: • Sub-agent commission = (Master agent commission rate − Sub-agent commission rate) × total income of (T2 + T3 + T4 + T5 + T6).
          - generic [ref=f1e535]:
            - heading "3. Agent Commission from Sub-agents" [level=4] [ref=f1e536]
            - list [ref=f1e537]:
              - listitem [ref=f1e538]: • Commission A receives from B = (22% − 18%) × 148M = 5.92M.
              - listitem [ref=f1e539]: • Commission A receives from C = (22% − 20%) × 167M = 3.34M.
              - listitem [ref=f1e540]: • A's total commission from sub-agents = 5.92M + 3.34M = 9.26M, shown in the source as 926 USD.
