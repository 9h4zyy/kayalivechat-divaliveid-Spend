      - generic [ref=f12e186]:
        - generic [ref=f12e187]:
          - heading "1. Commission Rate Calculation" [level=4] [ref=f12e188]
          - list [ref=f12e189]:
            - listitem [ref=f12e190]: • A's effective total income = A + B + C + D + E + F + G + H + I + J + K = 395M (22% commission rate).
            - listitem [ref=f12e191]: • B's effective total income = B + D + F + H + J = 148M (18% commission rate, as stated in the source).
            - listitem [ref=f12e192]: • C's effective total income = C + E + G + I + K = 167M (20% commission rate).
        - generic [ref=f12e193]:
          - heading "2. Sub-agent commission formula:" [level=4] [ref=f12e194]
          - paragraph [ref=f12e195]: • Sub-agent commission = (Master agent commission rate − Sub-agent commission rate) × total income of (T2 + T3 + T4 + T5 + T6).
        - generic [ref=f12e196]:
          - heading "3. Agent Commission from Sub-agents" [level=4] [ref=f12e197]
          - list [ref=f12e198]:
            - listitem [ref=f12e199]: • Commission A receives from B = (22% − 18%) × 148M = 5.92M.
            - listitem [ref=f12e200]: • Commission A receives from C = (22% − 20%) × 167M = 3.34M.
            - listitem [ref=f12e201]: • A's total commission from sub-agents = 5.92M + 3.34M = 9.26M, shown in the source as 926 USD.
